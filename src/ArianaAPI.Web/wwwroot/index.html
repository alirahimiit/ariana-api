<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آریانا - سیستم حسابداری</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ═══════════════ صفحه ورود ═══════════════ -->
    <div id="loginView" class="login-wrapper">
        <div class="login-card">
            <div id="licenseWarning" class="license-warning hidden"></div>

            <div class="login-header">
                <div class="logo-circle" id="loginLogo">
                    <span class="logo-text">آ</span>
                </div>
                <h1>سیستم حسابداری آریانا</h1>
                <p class="muted">برای ادامه وارد شوید</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>سازمان</label>
                        <select id="orgId" required>
                            <option value="">در حال بارگذاری...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>دوره مالی</label>
                        <select id="fyId" required>
                            <option value="">-- ابتدا سازمان --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>نام کاربری</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>

                <div class="form-group">
                    <label>API Key</label>
                    <input type="text" id="apiKey" value="dev-api-key-change-in-production" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span id="loginBtnText">ورود</span>
                </button>

                <div id="loginError" class="error-box hidden"></div>
            </form>
        </div>
    </div>

    <!-- ═══════════════ اپلیکیشن اصلی ═══════════════ -->
    <div id="appView" class="app-wrapper hidden">

        <!-- Overlay برای موبایل -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="appSidebar">
            <div class="sidebar-header">
                <div class="logo-mini" id="sidebarLogo">
                    <span class="logo-text">آ</span>
                </div>
                <div class="sidebar-title">
                    <span>آریانا</span>
                    <small id="sidebarSubtitle">حسابداری</small>
                </div>
                <button class="sidebar-close" id="btnSidebarClose" title="بستن">
                    ✕
                </button>
            </div>

            <nav class="nav" id="appNav">
                <div class="nav-group" data-group="main">
                    <div class="nav-group-header" data-toggle-group="main">
                        <span class="nav-group-icon">🏠</span>
                        <span class="nav-group-label">اصلی</span>
                        <span class="nav-group-arrow">▼</span>
                    </div>
                    <div class="nav-group-items">
                        <a class="nav-item" data-page="dashboard">
                            <span class="nav-icon">📊</span>
                            <span class="nav-label">داشبورد</span>
                        </a>
                    </div>
                </div>

                <div class="nav-group" data-group="accounting">
                    <div class="nav-group-header" data-toggle-group="accounting">
                        <span class="nav-group-icon">📚</span>
                        <span class="nav-group-label">حسابداری</span>
                        <span class="nav-group-arrow">▼</span>
                    </div>
                    <div class="nav-group-items">
                        <a class="nav-item" data-page="sanad">
                            <span class="nav-icon">📄</span>
                            <span class="nav-label">اسناد</span>
                        </a>
                        <a class="nav-item" data-page="ledger">
                            <span class="nav-icon">📒</span>
                            <span class="nav-label">دفتر حساب</span>
                        </a>
                        <a class="nav-item" data-page="taraz">
                            <span class="nav-icon">⚖️</span>
                            <span class="nav-label">تراز حساب‌ها</span>
                        </a>
                    </div>
                </div>

                <div class="nav-group" data-group="reports">
                    <div class="nav-group-header" data-toggle-group="reports">
                        <span class="nav-group-icon">📈</span>
                        <span class="nav-group-label">گزارش‌ها</span>
                        <span class="nav-group-arrow">▼</span>
                    </div>
                    <div class="nav-group-items">
                        <a class="nav-item" data-page="profitloss">
                            <span class="nav-icon">💰</span>
                            <span class="nav-label">سود و زیان</span>
                        </a>
                        <a class="nav-item" data-page="bilan">
                            <span class="nav-icon">⚖️</span>
                            <span class="nav-label">بیلان</span>
                        </a>
                        <a class="nav-item" data-page="daybook">
                            <span class="nav-icon">📘</span>
                            <span class="nav-label">دفتر روزنامه</span>
                        </a>
                    </div>
                </div>

                <div class="nav-group" data-group="base">
                    <div class="nav-group-header" data-toggle-group="base">
                        <span class="nav-group-icon">🗂️</span>
                        <span class="nav-group-label">اطلاعات پایه</span>
                        <span class="nav-group-arrow">▼</span>
                    </div>
                    <div class="nav-group-items">
                        <a class="nav-item" data-page="factor">
                            <span class="nav-icon">🧾</span>
                            <span class="nav-label">فاکتورها</span>
                        </a>
                        <a class="nav-item" data-page="hesab">
                            <span class="nav-icon">🏦</span>
                            <span class="nav-label">حساب‌ها</span>
                        </a>
                        <a class="nav-item" data-page="tafzili">
                            <span class="nav-icon">👥</span>
                            <span class="nav-label">تفضیلی‌ها</span>
                        </a>
                        <a class="nav-item" data-page="article">
                            <span class="nav-icon">🏷️</span>
                            <span class="nav-label">کالاها</span>
                        </a>
                        <a class="nav-item" data-page="sharh">
                            <span class="nav-icon">📝</span>
                            <span class="nav-label">شرح‌ها</span>
                        </a>
                        <a class="nav-item" data-page="kind">
                            <span class="nav-icon">🔖</span>
                            <span class="nav-label">انواع سند</span>
                        </a>
                    </div>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-mini" id="sidebarUserMini">
                    <div class="user-mini-avatar" id="sidebarUserAvatar">م</div>
                    <div class="user-mini-info">
                        <div class="user-mini-name" id="sidebarUserName">-</div>
                        <div class="user-mini-org" id="sidebarUserOrg">-</div>
                    </div>
                </div>
                <button id="logoutBtn" class="btn btn-ghost btn-block">
                    <span>🚪</span> خروج
                </button>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">
            <header class="topbar">
                <button class="topbar-btn hamburger" id="btnHamburger" title="منو">
                    ☰
                </button>

                <h2 id="pageTitle">داشبورد</h2>

                <div class="topbar-actions">
                    <button class="topbar-btn" id="btnSettings" title="تنظیمات">
                        ⚙️
                    </button>
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">م</div>
                        <div class="user-meta-desktop">
                            <div class="user-name" id="userName">-</div>
                            <div class="user-meta" id="userMeta">-</div>
                        </div>
                    </div>
                </div>
            </header>

            <section id="content" class="content"></section>
        </main>
    </div>

    <!-- ═══════════════ Modal ═══════════════ -->
    <div id="modal" class="modal hidden">
        <div class="modal-overlay" data-close></div>
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">جزئیات</h3>
                <button class="modal-close" data-close>&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <!-- ═══════════════ Toast ═══════════════ -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script src="js/exporter.js"></script>
    <script src="js/form-builder.js"></script>
    <script src="js/filter-panel.js"></script>
    <script src="js/table-enhancer.js"></script>
    <script src="js/core/helpers.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/http.js"></script>
    <script src="js/features/sanad.js"></script>
    <script src="js/features/sharh.js"></script>
    <script src="js/features/kind.js"></script>
    <script src="js/features/profitloss.js"></script>
    <script src="js/features/bilan.js"></script>
    <script src="js/features/article.js"></script>
    <script src="js/features/factor.js"></script>
    <script src="js/features/tafzili.js"></script>
    <script src="js/features/daybook.js"></script>
    <script src="js/features/dashboard.js"></script>
    <script src="js/features/hesab.js"></script>
    <script src="js/features/ledger.js"></script>
    <script src="js/features/taraz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
